<!DOCTYPE html>
<html>
<head>
  <title>Giulia 🎤</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }
    #chat {
      max-width: 600px;
      margin: auto;
      height: 70vh;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 10px;
    }
    .msg { margin: 10px; }
    .user { color: #38bdf8; }
    .ai { color: #4ade80; }
    #status { margin-top: 10px; opacity: 0.7; }
  </style>
</head>

<body>

<h2>Giulia 🎤 (Talk freely)</h2>

<div id="chat"></div>
<div id="status">🟡 Starting...</div>

<script>
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");

let recognizing = false;

// add message
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// voice output
function speak(text) {
  if (speechSynthesis.speaking) {
    speechSynthesis.cancel(); // interrupt
  }

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.02;
  utter.pitch = 1.05;

  speechSynthesis.speak(utter);
}

// send to backend
async function sendMessage(text, confidence) {
  addMsg("You: " + text, "user");

  const res = await fetch("https://your-backend-url/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ text, confidence })
  });

  const data = await res.json();

  addMsg("Giulia: " + data.reply, "ai");
  speak(data.reply);
}

// continuous listening
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    alert("Speech Recognition not supported");
    return;
  }

  const rec = new SR();

  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = "en-US";

  rec.onstart = () => {
    recognizing = true;
    statusText.innerText = "🎤 Listening...";
    
    // interrupt AI speaking when user starts talking
    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
    }
  };

  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    const confidence = e.results[0][0].confidence;

    sendMessage(text, confidence);
  };

    recognizing = false;
    statusText.innerText = "🟡 Waiting...
