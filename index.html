<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giulia AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .giulia-note { font-family: 'Caveat', cursive; }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="bg-[#f8fafc] h-screen flex flex-col">

    <nav class="p-4 bg-white border-b flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg shadow-emerald-200">G</div>
            <div>
                <h2 class="font-bold text-slate-800 tracking-tight">Giulia AI</h2>
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Active & Coaching</p>
                </div>
            </div>
        </div>
        <button class="w-10 h-10 rounded-full hover:bg-slate-100 transition flex items-center justify-center text-slate-400">
            <i class="fa-solid fa-bars-staggered"></i>
        </button>
    </nav>

    <main id="chat-window" class="flex-1 overflow-y-auto p-5 space-y-6">
        
        <div class="flex gap-3 max-w-[85%]">
            <div class="space-y-1">
                <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm">
                    <p class="text-slate-700 leading-relaxed">
                        Hi there! I'm <span class="text-emerald-600 font-bold">Giulia</span>. I've prepared some interview practice for you. Ready to dive in?
                    </p>
                </div>
                <p class="text-[10px] text-slate-400 ml-1">Giulia • 9:53 AM</p>
            </div>
        </div>

        <div class="flex gap-3 max-w-[85%] ml-auto flex-row-reverse">
            <div class="space-y-2 text-right">
                <div class="bg-emerald-600 p-4 rounded-2xl rounded-tr-none text-white shadow-md inline-block text-left">
                    <p>I <span class="bg-emerald-800/50 px-1 rounded border border-emerald-400/30">goes</span> to the store yesterday.</p>
                </div>
                <div class="flex justify-end">
                    <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-pen-nib text-amber-500 text-xs"></i>
                        <span class="text-amber-800 text-xs font-medium">Giulia suggests: <strong class="underline">went</strong></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="typing-indicator" class="flex gap-2 items-center ml-2">
            <span class="text-[10px] font-bold text-slate-400 uppercase">Giulia is thinking</span>
            <div class="flex gap-1">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t">
        <div class="max-w-3xl mx-auto">
            <div class="glass-input flex items-center gap-2 p-2 rounded-2xl shadow-lg transition-all focus-within:ring-2 focus-within:ring-emerald-500/20">
                <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-emerald-600 transition">
                    <i class="fa-solid fa-microphone-lines text-lg"></i>
                </button>
                <input 
                    type="text" 
                    placeholder="Message Giulia..." 
                    class="flex-1 bg-transparent border-none focus:ring-0 text-sm text-slate-700 py-2"
                >
                <button class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center hover:bg-emerald-700 shadow-md shadow-emerald-100 transition-transform active:scale-95">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            
            <div class="flex justify-center gap-6 mt-4">
                <button class="text-[11px] font-bold text-slate-400 hover:text-emerald-600 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-language"></i> TRANSLATE
                </button>
                <button class="text-[11px] font-bold text-slate-400 hover:text-emerald-600 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lightbulb"></i> EXPLAIN GRAMMAR
                </button>
            </div>
        </div>
    </footer>

</body>
</html>
