<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Giulia AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Fix for mobile viewport height */
        .main-container { height: 100dvh; } 
    </style>
</head>
<body class="bg-[#f8fafc] overflow-hidden">

    <div class="main-container flex flex-col">
        <nav class="p-4 bg-white border-b flex items-center gap-3 shrink-0">
            <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold">G</div>
            <div>
                <h2 class="font-bold text-slate-800 leading-none">Giulia AI</h2>
                <p class="text-[10px] font-bold text-green-500 uppercase mt-1">● Active</p>
            </div>
        </nav>

        <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex gap-3 max-w-[85%]">
                <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-700 text-sm">
                    Hi! I'm <strong>Giulia</strong>. Ready to start?
                </div>
            </div>
        </main>

        <footer class="p-4 bg-white border-t pb-8 md:pb-4 shrink-0">
            <div class="max-w-3xl mx-auto flex items-center gap-2 bg-slate-100 p-2 rounded-2xl shadow-inner">
                <button id="mic-btn" class="w-10 h-10 flex items-center justify-center text-slate-400">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <input 
                    id="user-input"
                    type="text" 
                    placeholder="Type here..." 
                    class="flex-1 bg-transparent border-none focus:ring-0 text-sm py-2 outline-none"
                >
                <button id="send-btn" class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatWindow = document.getElementById('chat-window');

        function sendMessage() {
            const text = input.value.trim();
            if (text !== "") {
                const userMsg = `<div class="flex gap-3 max-w-[85%] ml-auto flex-row-reverse">
                    <div class="bg-emerald-600 p-4 rounded-2xl rounded-tr-none text-white shadow-md text-sm">${text}</div>
                </div>`;
                chatWindow.insertAdjacentHTML('beforeend', userMsg);
                input.value = "";
                chatWindow.scrollTop = chatWindow.scrollHeight;
                
                // Giulia's personality response
                setTimeout(() => {
                    const giuliaMsg = `<div class="flex gap-3 max-w-[85%]">
                        <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-700 text-sm italic">
                            Giulia is thinking...
                        </div>
                    </div>`;
                    chatWindow.insertAdjacentHTML('beforeend', giuliaMsg);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 600);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keyup', (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
