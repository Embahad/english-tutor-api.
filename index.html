<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giulia AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        .typing-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        
        /* Smooth scrolling for chat */
        #chat-window { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-[#f8fafc] h-screen flex flex-col">

    <nav class="p-4 bg-white border-b flex justify-between items-center shadow-sm shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold">G</div>
            <div>
                <h2 class="font-bold text-slate-800">Giulia AI</h2>
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Active & Coaching</p>
                </div>
            </div>
        </div>
    </nav>

    <main id="chat-window" class="flex-1 overflow-y-auto p-5 space-y-6">
        <div class="flex gap-3 max-w-[85%]">
            <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-700">
                Hi! I'm <strong>Giulia</strong>. I'm so glad you're here. Ready to practice?
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t shrink-0">
        <div class="max-w-3xl mx-auto">
            <div class="bg-slate-100 flex items-center gap-2 p-2 rounded-2xl shadow-inner focus-within:ring-2 focus-within:ring-emerald-500/20">
                <button id="mic-btn" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-emerald-600 transition">
                    <i class="fa-solid fa-microphone-lines text-lg"></i>
                </button>
                
                <input 
                    id="user-input"
                    type="text" 
                    placeholder="Message Giulia..." 
                    class="flex-1 bg-transparent border-none focus:ring-0 text-sm text-slate-700 py-2 outline-none"
                    autocomplete="off"
                >
                
                <button id="send-btn" class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const chatWindow = document.getElementById('chat-window');

        // Function to add a message to the UI
        function addMessage(text, isUser = false) {
            const wrapper = document.createElement('div');
            wrapper.className = isUser ? "flex gap-3 max-w-[85%] ml-auto flex-row-reverse" : "flex gap-3 max-w-[85%]";
            
            const content = isUser 
                ? `<div class="bg-emerald-600 p-4 rounded-2xl rounded-tr-none text-white shadow-md">${text}</div>`
                : `<div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-700">${text}</div>`;
            
            wrapper.innerHTML = content;
            chatWindow.appendChild(wrapper);
            
            // Auto-scroll to bottom
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Send Logic
        function handleSend() {
            const msg = input.value.trim();
            if (msg) {
                addMessage(msg, true);
                input.value = '';
                
                // Simulate Giulia "Thinking"
                setTimeout(() => {
                    addMessage("That's interesting! Tell me more about that.", false);
                }, 1000);
            }
        }

        // Click Event
        sendBtn.addEventListener('click', handleSend);

        // Enter Key Event
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Simple Voice Feedback (Visual only)
        micBtn.addEventListener('click', () => {
            micBtn.classList.toggle('text-red-500');
            if(micBtn.classList.contains('text-red-500')) {
                input.placeholder = "Listening...";
            } else {
                input.placeholder = "Message Giulia...";
            }
        });
    </script>
</body>
</html>
