<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Giulia AI - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; }
        .main-container { height: 100dvh; }
        
        /* Voice Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(.33); opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        .mic-active { position: relative; color: #ef4444 !important; }
        .mic-active::after {
            content: '';
            position: absolute;
            width: 40px; height: 40px;
            background: #fca5a5;
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Message pop-in animation */
        .msg-pop { animation: pop 0.3s cubic-bezier(0.26, 0.53, 0.74, 1.48); }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">

    <div class="main-container flex flex-col">
        <nav class="p-4 bg-white border-b flex items-center justify-between shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg">G</div>
                <div>
                    <h2 class="font-bold text-slate-800 text-sm">Giulia AI</h2>
                    <div class="flex gap-1">
                        <div class="h-1 w-8 bg-emerald-500 rounded-full"></div>
                        <div class="h-1 w-8 bg-emerald-500 rounded-full"></div>
                        <div class="h-1 w-8 bg-slate-200 rounded-full"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 text-slate-400">
                <i class="fa-solid fa-fire text-orange-500"></i> <span class="text-xs font-bold text-slate-600">4 Day Streak</span>
            </div>
        </nav>

        <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
            <div class="flex gap-3 max-w-[85%] msg-pop">
                <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-700 text-sm leading-relaxed">
                    Hello! I've analyzed our last session. Your <strong>past participles</strong> are improving! Ready for a quick challenge?
                </div>
            </div>
        </main>

        <div id="feedback-bar" class="hidden px-4 py-2 bg-amber-50 border-t border-amber-100 flex items-center justify-between">
            <span class="text-[10px] font-bold text-amber-700 uppercase tracking-tighter">Giulia's Quick Tip</span>
            <span class="text-xs text-amber-900 italic">"I went" vs "I have gone"</span>
        </div>

        <footer class="p-4 bg-white border-t pb-10 md:pb-6 shrink-0 shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
            <div class="max-w-3xl mx-auto flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border border-slate-200 transition-all focus-within:bg-white focus-within:shadow-md">
                
                <button id="mic-btn" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:bg-slate-200 rounded-xl transition-all">
                    <i class="fa-solid fa-microphone text-xl"></i>
                </button>

                <input 
                    id="user-input"
                    type="text" 
                    placeholder="Speak or type to Giulia..." 
                    class="flex-1 bg-transparent border-none focus:ring-0 text-sm py-2 text-slate-700 font-medium placeholder:text-slate-400 outline-none"
                >

                <button id="send-btn" class="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-emerald-200 active:scale-90 transition-transform">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            
            <div class="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
                <button class="whitespace-nowrap px-3 py-1.5 rounded-full border border-slate-200 text-[10px] font-bold text-slate-500 hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200 transition">💡 SUGGEST REPLY</button>
                <button class="whitespace-nowrap px-3 py-1.5 rounded-full border border-slate-200 text-[10px] font-bold text-slate-500 hover:bg-emerald-50 hover:text-emerald-600 transition">🌍 TRANSLATE</button>
                <button class="whitespace-nowrap px-3 py-1.5 rounded-full border border-slate-200 text-[10px] font-bold text-slate-500 hover:bg-emerald-50 hover:text-emerald-600 transition">📖 VOCABULARY</button>
            </div>
        </footer>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const chatWindow = document.getElementById('chat-window');

        // Toggle Microphone Animation
        let isListening = false;
        micBtn.addEventListener('click', () => {
            isListening = !isListening;
            if(isListening) {
                micBtn.classList.add('mic-active');
                input.placeholder = "Listening... Speak now";
                // Add "Haptic" feel
                if(window.navigator.vibrate) window.navigator.vibrate(50);
            } else {
                micBtn.classList.remove('mic-active');
                input.placeholder = "Speak or type to Giulia...";
            }
        });

        function sendMessage() {
            const text = input.value.trim();
            if (text !== "") {
                const userMsg = `
                <div class="flex gap-3 max-w-[85%] ml-auto flex-row-reverse msg-pop">
                    <div class="bg-emerald-600 p-4 rounded-2xl rounded-tr-none text-white shadow-md text-sm font-medium leading-relaxed">${text}</div>
                </div>`;
                chatWindow.insertAdjacentHTML('beforeend', userMsg);
                input.value = "";
                chatWindow.scrollTop = chatWindow.scrollHeight;
                
                // Show thinking state
                setTimeout(() => {
                    const typing = `
                    <div id="typing" class="flex gap-3 max-w-[85%] msg-pop">
                        <div class="bg-white p-4 rounded-2xl rounded-tl-none border border-slate-200 shadow-sm text-slate-400 text-sm italic">
                           Giulia is analyzing...
                        </div>
                    </div>`;
                    chatWindow.insertAdjacentHTML('beforeend', typing);
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 600);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keyup', (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
