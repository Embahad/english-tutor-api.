<!DOCTYPE html>
<html>
<head>
  <title>AI English Tutor</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    #chat {
      border: 1px solid #ccc;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }
    .msg {
      margin: 10px 0;
    }
    .user { color: blue; }
    .ai { color: green; }
    input {
      width: 80%;
      padding: 10px;
    }
    button {
      padding: 10px;
    }
  </style>
</head>

<body>

<h2>AI English Tutor</h2>

<div id="chat"></div>

<input id="input" placeholder="Type or speak..." />
<button onclick="send()">Send</button>
<button onclick="startVoice()">🎤 Speak</button>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

// Text to speech
function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

// Add message
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Fake AI (we connect backend later)
async function send() {
  const text = input.value;
  if (!text) return;

  addMsg("You: " + text, "user");
  input.value = "";

  // temporary response (we connect Groq later)
  const reply = "Correct: I went to school yesterday.\nUse past tense 'went'.";

  addMsg("AI: " + reply, "ai");
  speak(reply);
}

// Voice input
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("Not supported");

  const rec = new SR();
  rec.lang = "en-US";

  rec.onresult = (e) => {
    input.value = e.results[0][0].transcript;
  };

  rec.start();
}
</script>

</body>
</html>
