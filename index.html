<!DOCTYPE html>
<html>
<head>
  <title>AI English Tutor</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 95%;
      max-width: 600px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 15px;
    }

    #chat {
      height: 55vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .msg {
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      max-width: 80%;
    }

    .user { background: #2563eb; margin-left: auto; }
    .ai { background: #16a34a; }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-bottom: 8px;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-right: 5px;
      cursor: pointer;
    }

    .mic { background: red; color: white; }
    .send { background: blue; color: white; }
  </style>
</head>

<body>

<div class="container">
  <h3>AI English Tutor 🎤</h3>

  <div id="chat"></div>

  <input id="input" placeholder="Speak or type..." />

  <button class="send" onclick="send()">Send</button>
  <button class="mic" onclick="startConversation()">🎤 Talk</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let recognition;
let isTalking = false;

// 🔊 Speak
function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 1;
  speechSynthesis.speak(u);
}

// 💬 Add message
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// 🤖 AI request
async function getAI(text) {
  const res = await fetch("https://english-tutor-backend-1.onrender.com/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  return data.reply;
}

// 📩 Manual send
async function send() {
  const text = input.value;
  if (!text) return;

  addMsg("You: " + text, "user");
  input.value = "";

  const reply = await getAI(text);
  addMsg("AI: " + reply, "ai");
  speak(reply);
}

// 🎤 FULL CONVERSATION MODE
function startConversation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    alert("Speech not supported");
    return;
  }

  recognition = new SR();
  recognition.lang = "en-US";
  recognition.continuous = true;

  isTalking = true;

  recognition.onresult = async (e) => {
    const text = e.results[e.results.length - 1][0].transcript;

    addMsg("You: " + text, "user");

    const reply = await getAI(text);
    addMsg("AI: " + reply, "ai");
    speak(reply);
  };

  recognition.start();
}
</script>

</body>
</html>
