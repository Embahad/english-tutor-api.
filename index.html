<!DOCTYPE html>
<html>
<head>
  <title>AI English Tutor</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    #chat {
      height: 400px;
      overflow-y: auto;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .msg {
      padding: 10px;
      border-radius: 10px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .user {
      background: #2563eb;
      align-self: flex-end;
    }

    .ai {
      background: #16a34a;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .send {
      background: #3b82f6;
      color: white;
    }

    .mic {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>AI English Tutor 🎓</h2>

  <div id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Type or speak..." />
    <button class="send" onclick="send()">Send</button>
    <button class="mic" onclick="startVoice()">🎤</button>
  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

// Speak AI response
function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

// Add message
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Send message (fake AI for now)
function send() {
  const text = input.value;
  if (!text) return;

  addMsg("You: " + text, "user");
  input.value = "";

  const reply = "Correct: I went to school yesterday.\nUse past tense 'went'.";

  addMsg("AI: " + reply, "ai");
  speak(reply);
}

// Voice input
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    alert("Speech recognition not supported");
    return;
  }

  const rec = new SR();
  rec.lang = "en-US";

  rec.onresult = (e) => {
    input.value = e.results[0][0].transcript;
  };

  rec.start();
}
</script>

</body>
</html>
