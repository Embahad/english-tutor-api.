<!DOCTYPE html>
<html>
<head>
  <title>Giulia 🎤</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 500px;
      margin: auto;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
    }

    /* HEADER */
    .header {
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* CHAT */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 18px;
      max-width: 80%;
      animation: fadeIn 0.25s ease;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TYPING DOTS */
    .typing {
      display: flex;
      gap: 5px;
      padding: 10px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #ccc;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    /* INPUT */
    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .send {
      background: #3b82f6;
      color: white;
    }

    .mic {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">✨ Giulia — Your AI Tutor</div>

  <div id="chat"></div>

  <div class="input-area">
    <input id="input" placeholder="Type or speak..." />
    <button class="send" onclick="send()">Send</button>
    <button class="mic" onclick="startVoice()">🎤</button>
  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

// 🔊 SPEAK
function speak(text) {
  if (speechSynthesis.speaking) speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02;
  u.pitch = 1.05;

  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang === "en-US");
  if (v) u.voice = v;

  speechSynthesis.speak(u);
}

// 💬 ADD MESSAGE
function addMsg(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ⏳ TYPING INDICATOR
function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing";

  div.innerHTML = `
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  `;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

// 🚀 SEND
async function send() {
  const text = input.value;
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  showTyping();

  const res = await fetch("https://english-tutor-backend-1.onrender.com/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  removeTyping();

  addMsg(data.reply, "ai");
  speak(data.reply);
}

// 🎤 VOICE
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("Not supported");

  const rec = new SR();
  rec.lang = "en-US";

  rec.onstart = () => {
    if (speechSynthesis.speaking) speechSynthesis.cancel();
  };

  rec.onresult = (e) => {
    input.value = e.results[0][0].transcript;
  };

  rec.start();
}

// 📱 HEIGHT FIX
window.onload = () => {
  document.body.style.height = window.innerHeight + "px";
};
</script>

</body>
</html>
